[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtest"
version = "0.4.0"
description = "Plain-English end-to-end tests for Android and iOS apps, driven by TypeSafe's Jev model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bret Hagen" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["testing", "e2e", "mobile", "android", "ios", "flutter", "react-native", "webview", "ai", "jev",
            "xcuitest", "uiautomator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
]

[project.urls]
Homepage = "https://just-betr.github.io/jevtest/"
Documentation = "https://just-betr.github.io/jevtest/"
Source = "https://github.com/Just-Betr/jevtest"
Issues = "https://github.com/Just-Betr/jevtest/issues"
Changelog = "https://github.com/Just-Betr/jevtest/blob/main/CHANGELOG.md"

[project.scripts]
jevtest = "jevtest.cli:main"

[tool.setuptools]
packages = ["jevtest", "jevtest.drivers"]

[tool.setuptools.package-data]
jevtest = ["ios_agent/**/*", "android_agent/**/*"]

[tool.setuptools.exclude-package-data]
jevtest = ["ios_agent/**/xcuserdata/**"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jevtest"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
