[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtest"
dynamic = ["version"]
description = "Plain-English end-to-end tests for Android and iOS apps, driven by TypeSafe's Jev model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bret Hagen" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "typing-extensions>=4.5; python_version < '3.12'"]
keywords = ["testing", "e2e", "mobile", "android", "ios", "flutter", "react-native", "webview", "ai", "jev",
            "xcuitest", "uiautomator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Typing :: Typed",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
]

[project.urls]
Homepage = "https://just-betr.github.io/jevtest/"
Documentation = "https://just-betr.github.io/jevtest/"
Source = "https://github.com/Just-Betr/jevtest"
Issues = "https://github.com/Just-Betr/jevtest/issues"
Changelog = "https://github.com/Just-Betr/jevtest/blob/main/CHANGELOG.md"

[project.scripts]
jevtest = "jevtest.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "jevtest.__version__" }

[tool.setuptools.packages.find]
include = ["jevtest*"]

[tool.setuptools.package-data]
jevtest = ["py.typed"]
"jevtest.adapters.devices" = ["ios_agent/**/*", "android_agent/**/*"]

[tool.setuptools.exclude-package-data]
"jevtest.adapters.devices" = ["ios_agent/**/xcuserdata/**"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-randomly>=3.16",
    "hypothesis>=6.120",
    "ruff>=0.16",
    "mypy>=1.15",
    "pyright>=1.1.400",
    "types-PyYAML",
    "import-linter>=2.1",
    "codespell>=2.4",
    "pre-commit>=4",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Deliberate choices, each with its reason:
    "D105",    # magic methods explain themselves
    "D107",    # __init__ arguments are documented on the class
    "TRY003",  # an error message says what to fix, so it's written where the knowledge is
    "EM101",   # (same) messages are written at the raise, not assigned to a variable first
    "EM102",   # (same)
    "PLR0913", # constructors take their collaborators explicitly
    "N818",    # StepFailed is a test failure, not an error: the domain names the difference
    "TC001",   # `from __future__ import annotations` everywhere: typing-only imports cost nothing at runtime,
    "TC002",   # and keeping every import at the top reads better than TYPE_CHECKING blocks
    "TC003",
    "CPY001",  # the licence is in LICENSE, not in a header on every file
    "S603",    # subprocess always gets an argument list, never a shell string
    "COM812",  # conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"jevtest/cli/**" = ["T201"]  # the command line prints
"jevtest/domain/kinds.py" = ["S105"]  # Status.PASS is a test outcome, not a password
# URLs are built by jevtest (the agents on localhost, the Jev API), never taken from input
"jevtest/adapters/devices/{android_tools,ios_tools}.py" = ["S310"]
"jevtest/adapters/jev/client.py" = ["S310"]
# The XML is the Android agent's own dump; Python's expat never resolves external entities
"jevtest/adapters/devices/{android,android_screen}.py" = ["S314"]
"tests/**" = [
    "D", "ANN", "S101", "PLR2004", "PLR0915", "PLR0917", "PT011", "C90", "PLC0415", "RUF043", "PT018",
    "ARG", "SLF001", "FBT", "INP001", "S108", "S105", "S106", "S314", "PLW0108", "N802", "E501",
]

[tool.ruff.format]
line-ending = "lf"
exclude = ["*.md"]  # the docs hold hand-aligned sketches, not code to format

[tool.mypy]
strict = true
python_version = "3.11"
files = ["jevtest", "tests"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool", "truthy-iterable", "possibly-undefined",
    "redundant-self", "unused-awaitable", "explicit-override", "mutable-override", "narrowed-type-not-subtype",
]

[[tool.mypy.overrides]]
# Tests: every function body is type-checked, but test functions and fixtures aren't annotated (pytest injects them).
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pyright]
include = ["jevtest", "tests"]
strict = ["jevtest"]  # the package is strict; tests are checked in standard mode (unannotated pytest functions)
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_package = "jevtest"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: dependencies point inward"
type = "layers"
layers = ["jevtest.cli", "jevtest.adapters | jevtest.application", "jevtest.domain"]

[[tool.importlinter.contracts]]
name = "The domain and the use cases import no I/O or third-party code"
type = "forbidden"
source_modules = ["jevtest.domain", "jevtest.application"]
forbidden_modules = ["yaml", "urllib", "http", "subprocess", "socket", "xml", "json", "threading", "time", "os",
                     "sys", "shutil", "tempfile", "plistlib", "zipfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["jevtest"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.codespell]
skip = "*.lock,*.lock.json,*.json,*.xml,*.png,*.pbxproj,gradlew.bat,./site,./.venv,./demo_app/build,./demo_app/ios/Pods,./test_dont_checkin"
ignore-words-list = "bakc,pressenter,nd"  # a deliberate typo in the error examples; PressEnter; 2nd
