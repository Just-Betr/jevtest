name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,docs]'
      # The coverage badge is measured here, on every push, from the same tests CI runs.
      - run: pytest --cov --cov-report=json:coverage.json
      - name: Coverage badge
        run: |
          mkdir -p docs/badges
          python - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if pct >= 100 else "green" if pct >= 90 else "yellow" if pct >= 75 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}
          json.dump(badge, open("docs/badges/coverage.json", "w"))
          PY
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
