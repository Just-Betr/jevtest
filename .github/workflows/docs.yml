name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site and the coverage badge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked --all-groups
      # The coverage badge is measured here, on every push, from the same tests CI runs.
      - run: uv run pytest --cov --cov-report=json:coverage.json
      - name: Coverage badge
        run: |
          mkdir -p docs/badges
          uv run python - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if pct >= 100 else "green" if pct >= 90 else "yellow" if pct >= 75 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}
          json.dump(badge, open("docs/badges/coverage.json", "w"))
          PY
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the site
      id-token: write  # prove to Pages that this workflow built it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
