# Tests for the demo app in demo_app/.
#
# Each test is a list of steps. A step does something, then checks what should be true:
#
#   do:      what a person would do, in plain English (Jev works out the taps and typing)
#   tap:     tap the thing with this exact text
#   see:     this exact text should be on the screen
#   expect:  this should be true of the screen (Jev judges it)
#
# Steps wait for what they need: `tap: Close` waits until "Close" is on the screen.
# If it doesn't show up within 10 seconds, the test fails. A slow step can say `timeout: 30`.
#
# The first run works out each `do:` with Jev and saves the steps it took; later runs repeat
# those exact steps. `use: Sign in` runs the Sign in test first. ${NAME} values come from .env.
#
# Run it:  jevtest run examples/demo.yaml --lock record --out jevtest-results

app:
  android: ../demo_app/build/app/outputs/flutter-apk/app-debug.apk
  ios: ${IOS_APP}

device:
  android: ${ANDROID_DEVICE}
  ios: ${IOS_DEVICE}

include: shared/auth.yaml

tests:
  - name: Sign in works
    fresh: true
    steps:
      - use: Sign in

  - name: Wrong password is rejected
    fresh: true
    steps:
      - do: Sign in with email "demo@jevtest.dev" and password "nope"
        expect: An error says the email or password is invalid

  - name: Counter buttons
    fresh: true
    steps:
      - use: Sign in
      - do: Tap the Add one button two times
        see: "Taps: 2"
      - double_tap: Double tap me
        see: "Double taps: 1"

  - name: Press and hold opens a dialog
    fresh: true
    steps:
      - use: Sign in
      - long_press: Press and hold me
        expect: A dialog says the item was held
      - tap: Close
        not_see: You held it

  - name: Notifications switch
    fresh: true
    steps:
      - use: Sign in
      - do: Turn notifications on
        see: Notifications are on

  - name: Open an item from the list
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open list
        direction: down
      - tap: Open list
        expect: A list of items is showing
      - scroll_to: Item 25
        direction: down
      - tap: Item 25
        see: Details for Item 25
      - back

  - name: Swipe to delete an item
    fresh: true
    steps:
      - use: Open an item from the list
      - scroll_to: Item 26
        direction: down
      - swipe: left
        target: Item 26
        see: Item 26 deleted

  - name: App survives rotation and backgrounding
    fresh: true
    steps:
      - use: Sign in
      - rotate: landscape
        expect: The home screen is showing
      - rotate: portrait
      - background: 2
        see: Welcome, demo@jevtest.dev
      - restart:
        expect: The sign in screen is showing

  - name: Open the web page
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open web page
        direction: down
      - tap: Open web page
        see: Web Greeter

  - name: Web page greets by name
    fresh: true
    steps:
      - use: Open the web page
      - do: Type "Bret" into the name box on the web page and press Say hello
        see: Hello, Bret!

  - name: Web page checkbox and link
    fresh: true
    steps:
      - use: Open the web page
      - scroll_to: I agree to the terms
        direction: down
      - tap: I agree to the terms
        see: Terms accepted
      - scroll_to: Show more
        direction: down
      - tap: Show more
      - scroll_to: Here is more content from the web page.
        direction: down
        see: Here is more content from the web page.

  - name: Native screen
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open native screen
        direction: down
      - tap: Open native screen
        see: Native screen
      - clear: Nickname
      - type: { text: "Bret", into: Nickname }
      - hide_keyboard
      - tap: Save nickname
        see: "Saved: Bret"
      - tap: Dark theme
        see: Theme is dark
      - tap: Delete account
        expect: A dialog asks to confirm deleting the account
      - tap: Delete
        see: Account deleted

  - name: Camera permission prompt
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open native screen
        direction: down
      - tap: Open native screen
        see: Native screen
      - tap: Ask for camera
        expect: The system is asking whether to allow camera access
      - do: Allow camera access
        see: "Camera: allowed"

  - name: Slow loading
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Load data
        direction: down
      - tap: Load data
        see: Data loaded

  - name: Web form
    fresh: true
    steps:
      - use: Open the web page
      - do: Type "Bert" into the name field
      - do: Clear the name field
      - do: Type "Bret" into the name field
      - hide_keyboard
      - tap: Say hello
        see: Hello, Bret!
      - do: Type "secret1" into the web password field
      - do: Choose Canada in the Country dropdown
        expect: Canada is the selected country
      - scroll_to: Submit form
        direction: down
      - tap: Pro plan
      - tap: I agree to the terms
        see: Terms accepted
      - tap: Submit form
      - scroll_to: "Submitted: Canada, Pro plan, with a password"
        direction: down

  - name: Web alert and navigation
    fresh: true
    steps:
      - use: Open the web page
      - scroll_to: Show web alert
        direction: down
      - tap: Show web alert
        see: Hello from the web page
      - tap: OK
        not_see: Hello from the web page
      - scroll_to: Open settings page
        direction: down
      - tap: Open settings page
        see: Web settings
      - tap: Back to the form
        expect: The web form with the name field is showing again

  - name: Long web page
    fresh: true
    steps:
      - use: Open the web page
      - scroll_to: Back to top
        direction: down
        see: End of the page
      - tap: Back to top
        see: Web Greeter
