# jevtest example: runs against the bundled demo app.
#   jevtest run examples/demo.yaml --platform android
#   jevtest run examples/demo.yaml --platform ios
#
# Every step is: an action, then what should be true after it.
#
#   - do: <what to do, in plain English>     Jev works out the taps and typing
#     expect: <what should now be true>      Jev judges it against the screen
#     see: <exact text on screen>            plain text check, no model
#
# `use: <test name>` runs another test's steps first, so tests build on each other.

app:
  android: ../demo_app/build/app/outputs/flutter-apk/app-debug.apk
  ios: ../demo_app/build/ios_sim/Build/Products/Debug-iphonesimulator/Runner.app

tests:
  - name: Sign in
    steps:
      - do: Sign in with email "demo@jevtest.dev" and password "hunter22"
        expect: The home screen is showing
        see: Welcome, demo@jevtest.dev

  - name: Wrong password is rejected
    steps:
      - do: Sign in with email "demo@jevtest.dev" and password "nope"
        expect: An error says the email or password is invalid

  - name: Counter buttons
    steps:
      - use: Sign in
      - do: Tap the Add one button two times
        see: "Taps: 2"
      - double_tap: Double tap me
        see: "Double taps: 1"

  - name: Press and hold opens a dialog
    steps:
      - use: Sign in
      - long_press: Press and hold me
        expect: A dialog says the item was held
      - tap: Close
        not_see: You held it

  - name: Notifications switch
    steps:
      - use: Sign in
      - do: Turn notifications on
        see: Notifications are on

  - name: Open an item from the list
    steps:
      - use: Sign in
      - scroll_to: Open list
      - tap: Open list
        expect: A list of items is showing
      - scroll_to: Item 25
      - tap: Item 25
        see: Details for Item 25
      - back           # an action with no check is fine too

  - name: Swipe to delete an item
    steps:
      - use: Open an item from the list
      - swipe: left
        target: Item 26
        see: Item 26 deleted

  - name: App survives rotation and backgrounding
    steps:
      - use: Sign in
      - rotate: landscape
        expect: The home screen is showing
      - rotate: portrait
      - background: 2
        see: Welcome, demo@jevtest.dev
      - restart:
        expect: The sign in screen is showing

  # In-app WebView: plain HTML (input, button, checkbox, link) inside the app.
  - name: Open the web page
    steps:
      - use: Sign in
      - scroll_to: Open web page
      - tap: Open web page
        see: Web Greeter

  - name: Web page greets by name
    steps:
      - use: Open the web page
      - do: Type "Bret" into the name box on the web page and press Say hello
        see: Hello, Bret!

  - name: Web page checkbox and link
    steps:
      - use: Open the web page
      - tap: I agree to the terms
        see: Terms accepted
      - tap: Show more
        expect: The page shows more content from the web page
