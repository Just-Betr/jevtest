# jevtest example: the bundled demo app (demo_app/), 17 tests.
#
#   cp examples/.env.example examples/.env     # then fill in your devices
#   jevtest run examples/demo.yaml --lock record --out jevtest-results
#
# Every step is an action, then what should be true after it:
#
#   - do: <what to do, in plain English>     Jev works out the taps and typing
#     expect: <what should now be true>      Jev judges it against the screen
#     see: <exact text on screen>            plain text check, no model
#
# `use: <test name>` runs another test's steps first, so tests build on each other.
# Every ${NAME} comes from examples/.env (or the environment). Each step waits up to 10 seconds
# for what it looks for; add `timeout: 30` to a step that needs longer.

app:
  android: ../demo_app/build/app/outputs/flutter-apk/app-debug.apk
  ios: ${IOS_APP}                # the simulator build, or a device build for a real iPhone

device:
  android: ${ANDROID_DEVICE}     # exact serial, model or AVD name (see `adb devices`)
  ios: ${IOS_DEVICE}             # exact name or UDID of a booted simulator or a connected iPhone
  # Several devices split the tests and run at the same time: android: [Pixel 4a, Pixel_10]

include: shared/auth.yaml        # the "Sign in" building block

tests:
  - name: Sign in works
    fresh: true
    steps:
      - use: Sign in

  - name: Wrong password is rejected
    fresh: true
    steps:
      - do: Sign in with email "demo@jevtest.dev" and password "nope"
        expect: An error says the email or password is invalid

  - name: Counter buttons
    fresh: true
    steps:
      - use: Sign in
      - do: Tap the Add one button two times
        see: "Taps: 2"
      - double_tap: Double tap me
        see: "Double taps: 1"

  - name: Press and hold opens a dialog
    fresh: true
    steps:
      - use: Sign in
      - long_press: Press and hold me
        expect: A dialog says the item was held
      - tap: Close
        not_see: You held it

  - name: Notifications switch
    fresh: true
    steps:
      - use: Sign in
      - do: Turn notifications on
        see: Notifications are on

  - name: Open an item from the list
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open list
        direction: down
      - tap: Open list
        expect: A list of items is showing
      - scroll_to: Item 25
        direction: down
      - tap: Item 25
        see: Details for Item 25
      - back           # an action with no check is fine too

  - name: Swipe to delete an item
    fresh: true
    steps:
      - use: Open an item from the list
      - swipe: left
        target: Item 26
        see: Item 26 deleted

  - name: App survives rotation and backgrounding
    fresh: true
    steps:
      - use: Sign in
      - rotate: landscape
        expect: The home screen is showing
      - rotate: portrait
      - background: 2
        see: Welcome, demo@jevtest.dev
      - restart:
        expect: The sign in screen is showing

  # In-app WebView: plain HTML (input, button, checkbox, link) inside the app.
  - name: Open the web page
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open web page
        direction: down
      - tap: Open web page
        see: Web Greeter

  - name: Web page greets by name
    fresh: true
    steps:
      - use: Open the web page
      - do: Type "Bret" into the name box on the web page and press Say hello
        see: Hello, Bret!

  - name: Web page checkbox and link
    fresh: true
    steps:
      - use: Open the web page
      - tap: I agree to the terms
        see: Terms accepted
      - scroll_to: Show more
        direction: down
      - tap: Show more
      - scroll_to: Here is more content from the web page.
        direction: down
        see: Here is more content from the web page.

  # Native (non-Flutter) screen: Android Views / iOS UIKit.
  - name: Native screen
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open native screen
        direction: down
      - tap: Open native screen
        see: Native screen
      - clear: Nickname
      - type: { text: "Bret", into: Nickname }
      - tap: Save nickname
        see: "Saved: Bret"
      - tap: Dark theme
        see: Theme is dark
      - tap: Delete account
        expect: A dialog asks to confirm deleting the account
      - tap: Delete
        see: Account deleted

  # A system permission prompt (owned by the OS, not the app).
  - name: Camera permission prompt
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Open native screen
        direction: down
      - tap: Open native screen
        see: Native screen
      - tap: Ask for camera
        expect: The system is asking whether to allow camera access
      - do: Allow camera access
        see: "Camera: allowed"

  # Content that arrives later (like a network response): checks wait for it, no sleeps needed.
  - name: Slow loading
    fresh: true
    steps:
      - use: Sign in
      - scroll_to: Load data
        direction: down
      - tap: Load data
        see: Data loaded

  # In-app web: a full form, a dropdown, radio buttons, clearing, a JavaScript alert,
  # navigation between web pages, and scrolling a long page.
  - name: Web form
    fresh: true
    steps:
      - use: Open the web page
      # Android System WebView 153 gives web text fields no name (see Troubleshooting), so Jev finds them.
      - do: Type "Bert" into the name field
      - do: Clear the name field
      - do: Type "Bret" into the name field
      - tap: Say hello
        see: Hello, Bret!
      - do: Type "secret1" into the web password field
      - do: Choose Canada in the Country dropdown
        expect: Canada is the selected country
      - scroll_to: Submit form
        direction: down
      - tap: Pro plan
      - tap: I agree to the terms
        see: Terms accepted
      - tap: Submit form
        see: "Submitted: Canada, Pro plan, with a password"

  - name: Web alert and navigation
    fresh: true
    steps:
      - use: Open the web page
      - scroll_to: Show web alert
        direction: down
      - tap: Show web alert
        see: Hello from the web page
      - tap: OK
        not_see: Hello from the web page
      - scroll_to: Open settings page
        direction: down
      - tap: Open settings page
        see: Web settings
      - tap: Back to the form
        expect: The web form with the name field is showing again

  - name: Long web page
    fresh: true
    steps:
      - use: Open the web page
      - scroll_to: Back to top
        direction: down
        see: End of the page
      - tap: Back to top
        see: Web Greeter
