# uv run pre-commit install — runs the same checks as CI before each commit.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: lint (every ruff rule)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: types (mypy --strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pyright
        name: types (pyright strict)
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: dependencies point inward
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: codespell
        name: spelling
        entry: uv run codespell
        language: system
        pass_filenames: false
      - id: pytest
        name: tests at 100% coverage
        entry: uv run pytest --cov -q
        language: system
        pass_filenames: false
        types: [python]
