site_name: jevtest
site_description: Plain-English end-to-end tests for Android and iOS apps, driven by TypeSafe's Jev model. Deterministic, strict, CI-ready.
site_url: https://just-betr.github.io/jevtest/
repo_url: https://github.com/Just-Betr/jevtest
repo_name: Just-Betr/jevtest
edit_uri: edit/main/docs/
copyright: MIT licensed · Copyright &copy; 2026 Bret Hagen

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/cellphone-check
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Writing tests: writing-tests.md
  - Guides:
      - Large suites: guides/large-suites.md
      - Real phones: guides/real-devices.md
      - WebViews and native screens: guides/webviews.md
      - CI: guides/ci.md
  - Reference:
      - Test file: reference/test-file.md
      - Steps and checks: reference/steps.md
      - Command line: reference/cli.md
      - Results and reports: reference/results.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Just-Betr/jevtest
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jevtest/

strict: true
